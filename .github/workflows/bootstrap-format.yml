name: Bootstrap Code Quality Fixes

on:
  push:
    paths:
      - ".github/workflows/bootstrap-format.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - name: Apply safe lint fixes and formatting
        run: |
          set -euo pipefail
          uv run ruff check --fix .
          uv run ruff format .
          uv run ruff check .
          python -m compileall -q src tests evals
      - name: Commit normalized source and remove bootstrap workflow
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize release code quality"
          git push
