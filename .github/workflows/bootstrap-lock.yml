name: Bootstrap uv Lockfile

on:
  push:
    paths:
      - ".github/workflows/bootstrap-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Resolve production lockfile
        run: uv lock
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          set -euo pipefail
          test -s uv.lock
          rm .github/workflows/bootstrap-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: add reproducible uv lockfile"
          git push
