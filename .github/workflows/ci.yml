name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinyfish_research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinyfish_research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: PostgreSQL storage integration test
        run: uv run pytest tests/test_storage_postgres.py -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinyfish_research_test
      - run: uv run python evals/run_evals.py
      - run: uv run pip-audit
      - run: uv build
      - name: MCP Inspector smoke test
        run: npx -y @modelcontextprotocol/inspector --cli uv run tinyfish-guided-research-mcp --method tools/list --format json
        env:
          TINYFISH_API_KEY: test-key-not-used-by-tools-list
