name: Diagnose Type Errors

on:
  push:
    paths:
      - ".github/workflows/diagnose-types.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Pyright error contexts
        run: |
          nl -ba src/tinyfish_research_mcp/core.py | sed -n '285,298p;650,663p;1115,1129p;1598,1612p;2572,2587p'
