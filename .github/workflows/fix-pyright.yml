name: Fix Pyright Type Errors

on:
  push:
    paths:
      - ".github/workflows/fix-pyright.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Apply narrow type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/tinyfish_research_mcp/core.py")
          text = path.read_text()

          replacements = [
              (
                  '''    authors = _normalize_author_key(\n        source.get("authors") or ([source.get("author")] if source.get("author") else [])\n    )''',
                  '''    raw_authors = source.get("authors")\n    if not isinstance(raw_authors, list):\n        raw_authors = [source.get("author")] if source.get("author") else []\n    authors = _normalize_author_key([str(author) for author in raw_authors if author is not None])''',
              ),
              (
                  '''        per_query[q] = [] if isinstance(result, Exception) else result''',
                  '''        if isinstance(result, BaseException):\n            per_query[q] = []\n        else:\n            per_query[q] = result''',
              ),
              (
                  '''    verdict = source.get("client_screen_verdict")''',
                  '''    verdict = str(source.get("client_screen_verdict") or "")''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected patch target not found:\n{old}")
              text = text.replace(old, new, 1)

          # asyncio.gather(..., return_exceptions=True) is typed as BaseException,
          # so narrow it correctly before tuple unpacking.
          count = text.count("if isinstance(result, Exception):")
          if count != 2:
              raise SystemExit(f"Expected exactly 2 gather exception guards, found {count}")
          text = text.replace("if isinstance(result, Exception):", "if isinstance(result, BaseException):")

          path.write_text(text)
          PY
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check --fix src/tinyfish_research_mcp/core.py
      - run: uv run ruff format src/tinyfish_research_mcp/core.py
      - run: uv run pyright
      - run: uv run pytest
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tinyfish_research_mcp/core.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve core static typing errors"
            git push
          fi
